[server]
maxUploadSize = 200  # MB; uploads are held in memory, keep small for hosted (~2.7 GB RAM) deployments
runOnSave = false

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
showErrorDetails = true

[theme]
base = "dark"
primaryColor = "#22D3EE"
backgroundColor = "#0A0F1A"
secondaryBackgroundColor = "#111827"
textColor = "#E6EAF0"
linkColor = "#22D3EE"
borderColor = "#1E293B"
showWidgetBorder = true
baseRadius = "8px"
baseFontSize = 14
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
codeFont = "JetBrains Mono:https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap"
headingFontWeights = [700, 650, 600, 600, 600, 600]
redColor = "#F04438"

[theme.sidebar]
backgroundColor = "#0B1220"
secondaryBackgroundColor = "#111827"
borderColor = "#1E293B"
